    return assetCache.get(key);
  }
  const cameras = [0, 1].map(() => new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 30));
  const toThree = ([x, y, z]) => new THREE.Vector3(x, z, -y);
  const controls = new OrbitControls(cameras[0], canvas);
  controls.enablePan = false;
  controls.enableDamping = false;
  controls.minZoom = 0.65;
  controls.maxZoom = 2.8;
  let exercise, clip, action, fields, linked, entries = [], mode = "front", time = 0, playing = true, last = performance.now(), poseUpdates = 0;
  function render() {
    renderer.setScissorTest(false);
    renderer.clear(true, true, true);
    renderer.setScissorTest(true);
    for (const entry of entries) {
      renderer.setViewport(entry.x, entry.y, entry.width, entry.height);
      renderer.setScissor(entry.x, entry.y, entry.width, entry.height);
      renderer.render(scene, entry.camera);
    }
    renderer.setScissorTest(false);
  }
  function layout() {
    if (!exercise) return;
    const width = Math.max(240, stage.clientWidth), dual2 = mode === "dual", stacked2 = dual2 && width < 540;
    const panelWidth = dual2 && !stacked2 ? (width - 12) / 2 : width;
    const panelHeight = Math.round(panelWidth / 1.65), height = stacked2 ? panelHeight * 2 + 12 : panelHeight;
    renderer.setSize(width, height, false);
    canvas.style.height = height + "px";
    const chosen = dual2 ? [0, 1] : [mode === "front" ? 0 : 1];
    entries = chosen.map((index, position) => {
      const camera = cameras[index], halfWidth = exercise.cameras[index].scale / 2;
      camera.left = -halfWidth;
      camera.right = halfWidth;
      camera.top = halfWidth / (panelWidth / panelHeight);
      camera.bottom = -camera.top;
      camera.updateProjectionMatrix();
      return {
        camera,
        width: panelWidth,
        height: panelHeight,
        x: stacked2 ? 0 : position * (panelWidth + 12),
        y: stacked2 ? position === 0 ? panelHeight + 12 : 0 : 0
      };
    });
    render();
  }
  function reset() {
    linked = null;
    exercise.cameras.forEach((preset, index2) => {
      cameras[index2].position.copy(toThree(preset.position));
      cameras[index2].zoom = 1;
      cameras[index2].lookAt(toThree(preset.target));
      cameras[index2].updateProjectionMatrix();
    });
    const index = mode === "back" ? 1 : 0;
    controls.object = cameras[index];
    controls.target.copy(toThree(exercise.cameras[index].target));
    controls.update();
    if (mode === "dual") linked = {
      rotation: cameras[0].quaternion.clone(),
      target: toThree(exercise.cameras[1].target),
      offset: cameras[1].position.clone().sub(toThree(exercise.cameras[1].target))
    };
    layout();
  }
  function pose(value) {
    time = Math.max(0, Math.min(clip.duration, value));
    action.paused = false;
    action.enabled = true;
    mixer.setTime(time);
    scene.updateMatrixWorld(true);
    for (const mesh of meshes) dq.update(mesh, exercise.skinning === "dualQuaternion");
    poseUpdates++;
    uniforms.heatPhase.value = 1;
    const phase = exercise.phases.find((phase2) => time >= phase2.start && time < phase2.end) ?? exercise.phases.at(-1);
    document.querySelector("#phase").textContent = phase?.label ?? "\u0414\u0432\u0438\u0436\u0435\u043D\u0438\u0435";
    document.querySelector("#timeline").value = String(time);
    render();
  }
  async function select(id) {
    const candidate = config.exercises.find((item) => item.id === id), request = ++selection;
    if (!candidate) throw Error("Unknown exercise: " + id);
    const loading = document.querySelector("#loading");
    loading.textContent = "\u0417\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044F 3D\u2026";
    loading.hidden = false;
    let asset;
    try {
      asset = await loadAsset(candidate.asset ?? "default");
    } catch (error) {
      if (request !== selection) return false;
      if (!gltf) throw error;
      loading.textContent = "\u041D\u0435 \u0443\u0434\u0430\u043B\u043E\u0441\u044C \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044C \u0443\u043F\u0440\u0430\u0436\u043D\u0435\u043D\u0438\u0435. \u041D\u0430\u0436\u043C\u0438\u0442\u0435 \u0435\u0433\u043E \u0435\u0449\u0451 \u0440\u0430\u0437.";
      return false;
    }
    if (request !== selection) return;
    if (gltf) scene.remove(gltf.scene);
    ({ gltf, meshes, bones, mixer } = asset);
    scene.add(gltf.scene);
    exercise = candidate;
    clip = gltf.animations.find((item) => item.name === "Exercise_" + id);
    if (!clip) throw Error("Animation is missing: " + id);
    mixer.stopAllAction();
    action = mixer.clipAction(clip).reset().setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.play();
    if (!asset.fields.has(id)) asset.fields.set(id, meshes.map((mesh) => {
      const field = attachHeatField(mesh, { ...config, ...exercise });
      return { field, attribute: mesh.geometry.getAttribute("heatZone") };
    }));
    fields = asset.fields.get(id);
    meshes.forEach((mesh, index) => mesh.geometry.setAttribute("heatZone", fields[index].attribute));
    const palette = exercise.displayMode === "stretch" ? ["#72b4cf", "#2297c3", "#b1f2f3"] : ["#f7a64b", "#f24720", "#ffe09a"];
    ["heatAmber", "heatRed", "heatCore"].forEach((name, i) => uniforms[name].value.set(palette[i]));
    describe(exercise);
    mode = exercise.displayMode === "stretch" ? "dual" : "front";
    document.querySelector("#view").value = mode;
    document.querySelector("#timeline").max = String(clip.duration);
    document.querySelectorAll("#exercises button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.id === id)));
    playing = true;
    document.querySelector("#play").textContent = "\u041F\u0430\u0443\u0437\u0430";
    reset();
    pose(0);
    document.querySelector("#loading").hidden = true;
  }
  controls.addEventListener("change", () => {
    if (linked) {
      const rotation = cameras[0].quaternion.clone().multiply(linked.rotation.clone().invert());
      cameras[1].position.copy(linked.offset).applyQuaternion(rotation).add(linked.target);
      cameras[1].zoom = cameras[0].zoom;
      cameras[1].lookAt(linked.target);
      cameras[1].updateProjectionMatrix();
    }
    render();
  });
  document.querySelector("#play").onclick = () => {
    playing = !playing;
    document.querySelector("#play").textContent = playing ? "\u041F\u0430\u0443\u0437\u0430" : "\u041F\u0440\u043E\u0434\u043E\u043B\u0436\u0438\u0442\u044C";
  };
  document.querySelector("#reset").onclick = reset;
  document.querySelector("#view").onchange = (event) => {
    mode = event.target.value;
    reset();
  };
  document.querySelector("#background").onchange = (event) => {
    stage.dataset.background = event.target.value;
  };
  document.querySelector("#zones").onchange = (event) => {
    uniforms.heatEnabled.value = Number(event.target.checked);
    render();
  };
  document.querySelector("#strength").oninput = (event) => {
    uniforms.heatStrength.value = Number(event.target.value);
    render();
  };
  document.querySelector("#timeline").oninput = (event) => {
    playing = false;
    document.querySelector("#play").textContent = "\u041F\u0440\u043E\u0434\u043E\u043B\u0436\u0438\u0442\u044C";
    pose(Number(event.target.value));
  };
  new ResizeObserver(layout).observe(stage);
  await select(initial.id);
  document.querySelector("#poster")?.remove();
  document.querySelectorAll("#exercises button").forEach((button) => {
    button.disabled = false;
  });
  window.heatReady = true;
  window.heatSelect = select;
  window.heatFrame = (value) => {
    playing = false;
    document.querySelector("#play").textContent = "\u041F\u0440\u043E\u0434\u043E\u043B\u0436\u0438\u0442\u044C";
    pose(value);
  };
  window.heatSkinning = (value) => {
    if (!["linear", "dualQuaternion"].includes(value)) throw Error("Unknown skinning mode");
    exercise.skinning = value;
    pose(time);
  };
  window.heatProbe = () => {
    const gl = renderer.getContext(), pixel = new Uint8Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    return {
      exerciseId: exercise.id,
      time,
      playing,
      duration: clip.duration,
      action: clip.name,
      mode,
      displayMode: exercise.displayMode,
      asset: exercise.asset ?? "default",
      loadedAssets: assetCache.size,
      skinning: exercise.skinning ?? "linear",
      viewportCount: entries.length,
      cameras: cameras.map((camera) => ({ position: camera.position.toArray(), zoom: camera.zoom })),
      panEnabled: controls.enablePan,
      heatEnabled: uniforms.heatEnabled.value,
      heatPhase: uniforms.heatPhase.value,
      heatStrength: uniforms.heatStrength.value,
      meshes: meshes.length,
      bones: bones.size,
      poseUpdates,
      colorTextures: material.map ? 1 : 0,
      ao: !!material.aoMap,
      shadows: renderer.shadowMap.enabled,
      transparentCanvas: renderer.getContextAttributes().alpha && scene.background === null,
      cornerAlpha: pixel[3],
      sourceVertices: fields[0].field.sourceVertexCount,
      primary: Array.from(fields[0].field.primary),
      secondary: Array.from(fields[0].field.secondary),
      morphWeights: meshes.map((mesh) => Array.from(mesh.morphTargetInfluences ?? [])),
      joints: Object.fromEntries([...bones].map(([name, bone]) => [name, bone.getWorldPosition(new THREE.Vector3()).toArray()]))
    };
  };
  window.heatSurface = (ids) => {
    const result = {}, point = new THREE.Vector3();
    for (const mesh of meshes) {
      const source = mesh.geometry.getAttribute("_source_index");
      mesh.skeleton.update();
      for (let i = 0; i < source.count; i++) {
        const id = Math.round(source.getX(i));
        if (ids && !ids.includes(id)) continue;
        mesh.getVertexPosition(i, point);
        mesh.localToWorld(point);
        result[id] = point.toArray();

    }
    return result;
  };
  window.heatFrustum = () => entries.map(({ camera }) => {
    const min = [Infinity, Infinity], max = [-Infinity, -Infinity], point = new THREE.Vector3();

      mesh.skeleton.update();

        mesh.getVertexPosition(i, point);

  requestAnimationFrame(tick);
}
main().catch((error) => {
  window.heatError = error.message;
  const loading = document.querySelector("#loading");
  loading.textContent = "\u041D\u0435 \u0443\u0434\u0430\u043B\u043E\u0441\u044C \u043E\u0442\u043A\u0440\u044B\u0442\u044C 3D. ";
  const retry = document.createElement("button");
  retry.type = "button";
  retry.textContent = "\u041F\u043E\u043F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C \u0435\u0449\u0451 \u0440\u0430\u0437";
  retry.onclick = () => window.location.reload();
  loading.append(retry);
  loading.hidden = false;
});
</script></body></html>
