<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новая пачка и исправление №5</title>
<style>
:root{color-scheme:light dark;--foreground:light-dark(#202932,#edf1f4);--muted-foreground:light-dark(#5c6871,#acb7c0);--border:light-dark(#d1d9df,#44515a);--secondary:light-dark(#edf1f4,#26323a)}
*{box-sizing:border-box}body{margin:0;padding:0;background:transparent;color:var(--foreground);font:14px/1.5 system-ui,sans-serif}main{margin:0}h2{font-size:19px;margin:0 0 3px;font-weight:650}p{margin:5px 0 12px;color:var(--muted-foreground)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}button,select{font:inherit;padding:7px 10px;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:7px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ea8950;outline-offset:3px}.tools label{display:flex;align-items:center;gap:6px}.tools select{max-width:100%}
#stage{position:relative;overflow:hidden;border-radius:10px;min-height:180px}#stage[data-background=dark]{background:#161d24}#stage[data-background=white]{background:#fff}#stage[data-background=checker]{background:repeating-conic-gradient(#d7dce1 0% 25%,#f4f6f8 0% 50%) 0/24px 24px}canvas{display:block;width:100%;height:auto;background:transparent;touch-action:none}#poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}#loading{position:absolute;bottom:8px;left:8px;padding:4px 7px;border-radius:4px;font-size:12px;background:#161d24cc;color:#fff}#loading[hidden]{display:none}
.scrub{display:flex;align-items:center;gap:12px;margin:12px 0}#timeline{flex:1;min-width:80px}#phase{font-size:12px;width:140px;text-align:right;color:var(--muted-foreground)}input[type=range]{accent-color:#dd713b}.strength input{width:95px}.zones{font-size:12px;display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}.zones span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#ef592c}.zones .secondary:before{background:#eba34c}.note{font-size:12px;margin:12px 0 0}
@media(max-width:539px){#stage{min-height:180px}.tools{gap:7px}button,select{font-size:13px}.tools label{font-size:13px}.zones{gap:8px}}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}nav button{font-size:12px;padding:6px 9px}nav button[aria-pressed=true]{border-color:#e39c6c;background:light-dark(#f5e9dd,#4b3528)}#legend[data-mode=stretch] span:before{background:#63c9e5}#legend[data-mode=stretch] .secondary:before{background:#9bc9d9}#movement-note{font-size:12px;min-height:36px}#phase{line-height:1.2}#stage:focus-visible{outline:2px solid #e39c6c;outline-offset:3px}</style></head><body><main>
<nav id="exercises" aria-label="Выбор упражнения"></nav><h2 id="exercise-title">Локоть над головой · исправление</h2><p id="exercise-description">Поверните модель пальцем или мышью</p>
<div class="tools"><label>Ракурс <select id="view"><option value="dual">Два рекомендуемых</option><option value="front">Мышцы и движение</option><option value="back">Опоры и поза</option></select></label><button id="reset" type="button">Вернуть ракурс</button><label>Фон <select id="background"><option value="dark">Тёмный</option><option value="white">Белый</option><option value="checker">Прозрачность</option></select></label></div>
<div id="stage" data-background="dark"><canvas width="1296" height="786" aria-label="Живая 3D-анимация упражнения с мягкими зонами мышц"></canvas>__POSTER__<span id="loading" role="status">Загружается 3D…</span></div>
<div class="scrub"><button id="play" type="button">Пауза</button><input id="timeline" type="range" min="0" max="5" step="0.001" value="0" aria-label="Положение движения"><span id="phase" aria-live="off">Начальная позиция</span></div>
<div class="tools"><label><input id="zones" type="checkbox" checked>Подсветка</label><label class="strength">Яркость <input id="strength" type="range" min="0.55" max="1.35" step="0.01" value="1" aria-label="Яркость горячей зоны"></label></div>
<div class="zones" id="legend"><span id="main-zone"></span><span class="secondary" id="additional-zone"></span></div><p id="movement-note"></p>
<p class="note">Тёплые зоны — нагрузка; голубые — растяжение. Это условные зоны упражнения, а не измерение активации или силы. Остальное тело нейтральное.</p>
</main>__SCRIPTS__</body></html>
